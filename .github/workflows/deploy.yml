name: Deploy

# Puts the site online on the Scaleway VPS (docs/adr/0009-vps-scaleway.md): the CI checks, then the images
# ghcr.io/achaak/optizzz-{web,tools} tagged with the commit, then deploy/deploy.sh over SSH (migrations, rights, site).
# The hourly ingest runs on the VPS itself (deploy/systemd/optizzz-ingest.timer).
on:
  push:
    branches: [main]
    paths:
      - apps/web/**
      - packages/**
      - pnpm-lock.yaml
      - deploy/**
      - .github/workflows/deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  images:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # The site's build prerenders pages from a database: an empty one is enough (deploy.sh rebuilds them once online).
    services:
      postgres:
        image: postgres:18.0-alpine
        env:
          POSTGRES_USER: optizzz
          POSTGRES_PASSWORD: optizzz
          POSTGRES_DB: optizzz
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      BUILD_DATABASE_URL: postgresql://optizzz:optizzz@localhost:5432/optizzz
      WEB: ghcr.io/achaak/optizzz-web:${{ github.sha }}
      TOOLS: ghcr.io/achaak/optizzz-tools:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Tools image, then the migrations on the build database
        run: |
          docker build -f apps/web/Dockerfile --target tools \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$TOOLS" .
          docker run --rm --network host -e DATABASE_URL="$BUILD_DATABASE_URL" "$TOOLS" pnpm db:deploy
      - name: Site image
        run: |
          docker build -f apps/web/Dockerfile --target web --network host \
            --build-arg DATABASE_URL="$BUILD_DATABASE_URL" \
            --build-arg NEXT_PUBLIC_ADSENSE_CLIENT="${{ vars.NEXT_PUBLIC_ADSENSE_CLIENT }}" \
            --build-arg NEXT_PUBLIC_ADSENSE_SLOT="${{ vars.NEXT_PUBLIC_ADSENSE_SLOT }}" \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} -t "$WEB" .
      - run: docker push "$TOOLS" && docker push "$WEB"

  deploy:
    needs: images
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: SSH key and the VPS's host key
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" >~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" >~/.ssh/known_hosts
      - name: Copy deploy/ and run deploy.sh
        env:
          VPS: optizzz@${{ secrets.VPS_HOST }}
        run: |
          scp -r deploy/compose.yml deploy/Caddyfile deploy/deploy.sh deploy/ingest.sh deploy/backup.sh \
            deploy/postgres deploy/systemd "$VPS:/opt/optizzz/"
          ssh "$VPS" /opt/optizzz/deploy.sh "${{ github.sha }}"
      # Through Caddy and HTTPS, as a visitor: deploy.sh only knows the container answers on the VPS itself.
      - name: The site answers, its database included
        run: curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors https://optizzz.fr/api/health
