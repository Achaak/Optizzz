name: Release

# A push to main that changes package.json's version publishes it: the CI checks run, both stores get it,
# and the GitHub release creates the tag vX.Y.Z. Run it by hand to publish a version whose tag is missing.
# The store listings must already exist: the first submission is done by hand.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      unpublished: ${{ steps.version.outputs.unpublished }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Is this version already tagged?
        id: version
        run: |
          tag="v$(node -p 'require("./package.json").version')"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" > /dev/null; then
            echo "$tag is already published"
            echo "unpublished=false" >> "$GITHUB_OUTPUT"
          else
            echo "unpublished=true" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: version
    if: needs.version.outputs.unpublished == 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [version, check]
    runs-on: ubuntu-latest
    permissions:
      contents: write # the tag and the GitHub release with the zips
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - run: pnpm zip
      - run: pnpm zip:firefox

      # Chrome refuses an upload while a version is in review: the new version replaces it.
      # No --firefox-compatibility: AMO takes Firefox and Android from the manifest's gecko settings
      # and refuses to override them.
      - name: Submit to Chrome Web Store and Firefox Add-ons
        run: >
          pnpm wxt submit
          --chrome-zip .output/*-chrome.zip
          --chrome-api-version v2
          --chrome-cancel-pending
          --firefox-zip .output/*-firefox.zip
          --firefox-sources-zip .output/*-sources.zip
        env:
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}

      - name: Tag and attach the store packages to the GitHub release
        run: >
          gh release create "$TAG" .output/*.zip
          --target "$GITHUB_SHA" --title "$TAG" --generate-notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          GH_TOKEN: ${{ github.token }}
