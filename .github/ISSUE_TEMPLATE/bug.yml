name: Signaler un bug
description: Quelque chose ne marche pas comme prévu dans Optizzz.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Merci de prendre le temps de signaler un problème ! Plus la description est précise, plus il sera rapide à corriger.
  - type: textarea
    id: what-happens
    attributes:
      label: Ce qui se passe
      description: Décris le problème. Une capture d'écran aide beaucoup.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Ce qui devrait se passer
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Comment reproduire
      description: Les étapes pour voir le problème.
      placeholder: |
        1. Aller sur la page Armée
        2. Cliquer sur…
        3. …
  - type: input
    id: page
    attributes:
      label: Page du jeu concernée
      placeholder: "ex. Reine.php, Armee.php, carte de l'alliance…"
  - type: input
    id: server
    attributes:
      label: Serveur
      placeholder: "ex. s1, s5…"
  - type: input
    id: version
    attributes:
      label: Version d'Optizzz
      description: Visible dans « À propos ».
      placeholder: "ex. 1.0.1"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur
      placeholder: "ex. Firefox 142, Chrome 140…"
    validations:
      required: true
